<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
        }

        h2 { margin: 0 0 8px 0; }

        #controles {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h2>Zé, Chatbot do Zéfiro</h2>

    <div id="controles">
         <input id="inputChat" placeholder="Digite sua mensagem..." style="flex:1"/>
         <button id="inputChatBtn">Enviar</button>
         <button id="assistantChatBtn">🔄</button>  
    </div>
   
    <div id="chat"></div>
    <title>Chat - Zéfiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./csspages/chat.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <div class="bot-info">
                    <div class="bot-avatar">
                        <!-- talvez fazer um icone no figma pra cá -->
                        <span>O</span>
                    </div>
                    <div>
                        <h1>Zéfiro Bot</h1>
                        <p>Online</p>
                    </div>
                </div>
                <!-- por algum motivo nãoo ta funcionando, deve ser erro no js do dashboard - jullian -->
                <a href="./dashboard.html" class="back-btn">← Voltar</a>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-container" id="messagesContainer">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Olá! 👋 Bem-vindo ao Zéfiro Bot. Como posso ajudá-lo hoje?</p>
                </div>
                <span class="message-time">10:30</span>
            </div>
        </div>

        <!-- Input Area -->
         <!-- mudar muitas coisas aqui -->
        <div class="chat-input-area">
            <form id="chatForm" class="input-form">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem..." 
                    autocomplete="off"
                >
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.40,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346273 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99701575 L3.03521743,10.4380088 C3.03521743,10.5951061 3.19218622,10.7522035 3.50612381,10.7522035 L16.6915026,11.5376905 C16.6915026,11.5376905 17.1624089,11.5376905 17.1624089,12.0089826 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z" fill="currentColor"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="../js/pages/chat.js"></script>

    
</body>
</html>
